# N1（13 号设计 §五，2026-10-16 改写版）：工具链消费冒烟
# 改写说明：原设计 N1 = 自建 LLVM 构建链（scripts/build_llvm.sh + cache）。
# 2026-10-16 审计改写：LLVM 永不自建——工具链由官方配方原样复刻仓
# （Da-AiXZ/nyxian-official-replica，run 38873142024 绿跑）发布 GitHub
# Release，本 job 消费之：下载 → 布局落位 → CC/MDK 真编译链接冒烟。
# 环境组合先例：probe 仓 run 38565498097 实证"Xcode 26.6 构建的工具链
# + macos-15/Xcode 16.4 消费端编译链接 = 成功"。
# 验收（N1）：CC framework + MDK framework 真编译链接通过（vendored
# main@0587c30 源码 36+47 文件全量）。

name: CC-MDK Smoke (toolchain consume)

on:
  push:
    branches: [main]
    paths:
      - 'Vendor/nyxian/**'
      - 'Configs/**'
      - 'project.yml'
      - '.github/workflows/cc-mdk-smoke.yml'
  workflow_dispatch:

env:
  TOOLCHAIN_REPO: Da-AiXZ/nyxian-official-replica
  TOOLCHAIN_TAG: toolchain-0587c30-20261016

jobs:
  smoke:
    # 官方绿跑同款环境（macos-latest = macos-26-arm64 / Xcode 26.6）。
    # 必要性（run 38933052078 undefined 实证 + 本地字节级探针）：
    # 官方工具链 llvm.a 的 SYMDEF 索引部分缺失（成员定义在、索引没收录），
    # Xcode 26.6 的 ld 有"归档成员扫描兜底"能解析；macos-15/Xcode 16.4 的
    # 旧 ld 信任 TOC 无兜底 → undefined。官方配方=官方环境，回归官方地面。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download toolchain from Release (pinned tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TOOLCHAIN_TAG" \
            --repo "$TOOLCHAIN_REPO" \
            --output toolchain.zip
          ls -lh toolchain.zip
          # 完整性锚：1,412,422,533 bytes（run 38873142024 artifact 原值）
          SIZE=$(stat -f%z toolchain.zip)
          echo "downloaded: $SIZE bytes"
          test "$SIZE" -eq 1412422533 || { echo "!! size mismatch"; exit 1; }

      - name: Unpack + layout (probe-verified two-step mv)
        run: |
          set -euo pipefail
          unzip -q -o toolchain.zip
          echo "=== 解包完整性验证 ==="
          test -f LLVM.xcframework/ios-arm64/llvm.a && echo "llvm.a ✓" || { echo "!! llvm.a 缺失"; exit 1; }
          DYLIB_COUNT=$(find CoreCompilerSupportLibs -name "lib_CompilerSwift*.dylib" | wc -l | tr -d ' ')
          echo "SupportLibs dylib count: ${DYLIB_COUNT} (expect 14)"
          test "$DYLIB_COUNT" -eq 14 || { echo "!! dylib count mismatch"; exit 1; }
          test -f LLVM.xcframework/ios-arm64/Headers/llvm/Support/Threading.h && echo "Threading.h ✓" || { echo "!! Headers 不完整"; exit 1; }
          rm -rf Vendor/nyxian/CoreCompilerSupportLibs
          mv CoreCompilerSupportLibs Vendor/nyxian/
          mv LLVM.xcframework Vendor/nyxian/CoreCompilerSupportLibs/
          test -f Vendor/nyxian/CoreCompilerSupportLibs/LLVM.xcframework/ios-arm64/llvm.a && echo "mv 后布局验证 ✓" || { echo "!! mv 后布局错误"; exit 1; }
          du -sh Vendor/nyxian/CoreCompilerSupportLibs

      - name: Generate placeholder build-time resources (ERR-008/ERR-019 precedents)
        run: |
          # 主工程的两个构建期资源由主流水线的 iSH/rootfs 脚本顺带产出
          # （build_ish.sh:207 → RootfsPatch.bundle；fetch_rootfs.sh →
          # alpine-rootfs.zip）。本 smoke 只编译 CC/MDK framework——不 boot
          # guest、不触碰 rootfs 内容，占位即可（test.yml 同款先例）。
          mkdir -p WanWo/Resources Vendor/resources/RootfsPatch.bundle
          PLACEHOLDER_DIR="$(mktemp -d)"
          echo "placeholder rootfs (smoke never boots the guest)" > "$PLACEHOLDER_DIR/placeholder.txt"
          (cd "$PLACEHOLDER_DIR" && zip -qry "$GITHUB_WORKSPACE/WanWo/Resources/alpine-rootfs.zip" .)
          echo "placeholder RootfsPatch bundle (smoke never applies overlay)" > Vendor/resources/RootfsPatch.bundle/placeholder.txt
          ls -lh WanWo/Resources/alpine-rootfs.zip

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build settings sanity (golden values)
        run: |
          xcodebuild -project WanWo.xcodeproj -target CoreCompiler -showBuildSettings 2>/dev/null \
            | grep -E "HEADER_SEARCH_PATHS|LIBRARY_SEARCH_PATHS|OTHER_LDFLAGS" | head -6

      - name: Build CoreCompiler framework (real compile+link, 36 files)
        run: |
          set -o pipefail
          xcodebuild \
            -project WanWo.xcodeproj \
            -target CoreCompiler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -30

      - name: Build MobileDevelopmentKit framework (47 files, links CoreCompiler)
        run: |
          set -o pipefail
          xcodebuild \
            -project WanWo.xcodeproj \
            -target MobileDevelopmentKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -30

      - name: Verify products
        run: |
          set -euo pipefail
          CC_BIN=$(find build -path "*Release-iphoneos/CoreCompiler.framework/CoreCompiler" -type f | head -1)
          MDK_BIN=$(find build -path "*Release-iphoneos/MobileDevelopmentKit.framework/MobileDevelopmentKit" -type f | head -1)
          test -n "$CC_BIN" && test -n "$MDK_BIN"
          echo "=== framework 产物 ==="
          ls -lh "$CC_BIN" "$MDK_BIN"
          file "$CC_BIN"
          # 链接健全性：CC 二进制应含 swift/clang 符号（llvm.a 静态链接进来的证据）
          nm "$CC_BIN" 2>/dev/null | grep -c "swift" || true
