name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # N2 修⑧（run 38951761344 undefined 实证）：CC 的 llvm.a 含 Swift 编译成员
    # （swiftASTGen Bridge.swift.o），引用 Swift 6.4 运行时符号
    # （_swift_coroFrameAlloc）——Xcode 16.4 的 Swift 6.0 运行时缺失。
    # 统一回归官方绿跑同款环境 macos-latest/Xcode 26.6（主 App+编译栈全套）。
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          # llvm + lld：vdso 交叉构建需要（clang -target aarch64-linux-gnu -fuse-ld=lld）
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      # 【N2】CC/MDK framework 已接入主 App（dependencies）——构建期链接
      # 需要 SupportLibs 在位：下载官方配方工具链 Release 并落位
      # （cc-mdk-smoke 同款两步 mv；尺寸锚 1,412,422,533 bytes）。
      - name: Download Nyxian toolchain (CC/MDK link inputs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download toolchain-0587c30-20261016 \
            --repo Da-AiXZ/nyxian-official-replica \
            --output toolchain.zip
          SIZE=$(stat -f%z toolchain.zip)
          test "$SIZE" -eq 1412422533 || { echo "!! size mismatch: $SIZE"; exit 1; }
          unzip -q -o toolchain.zip
          rm -rf Vendor/nyxian/CoreCompilerSupportLibs
          mv CoreCompilerSupportLibs Vendor/nyxian/
          mv LLVM.xcframework Vendor/nyxian/CoreCompilerSupportLibs/
          test -f Vendor/nyxian/CoreCompilerSupportLibs/LLVM.xcframework/ios-arm64/llvm.a \
            && echo "toolchain layout ✓"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iPad)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      # N10d：SwiftTerm SPM 解析断言（防网络抖动静默降级——SPM resolve 失败
      # 时 xcodebuild 可能跳过该依赖继续编（TerminalView 符号缺失会在链接期
      # 才爆/或被宏吞掉），此门以 Package.resolved 双断言锁死：identity 在场
      # + 版本=1.13.0（拍板项 1 exactVersion 锁定；官方 0.10.3 Package.resolved
      # 同版本同源 revision 8e7a1e1）。观察项：GitHub 可达性（方案 §三 4）。
      - name: N10 SwiftTerm SPM gate
        run: |
          set -euo pipefail
          RESOLVED="WanWo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          test -f "$RESOLVED" || { echo "!! Package.resolved 缺失（SPM 未解析——SwiftTerm 拉取静默降级？）"; exit 1; }
          grep -q '"identity" : "swiftterm"' "$RESOLVED" || { echo "!! swiftterm 不在 Package.resolved（SPM 解析缺 SwiftTerm）"; exit 1; }
          grep -q '"version" : "1.13.0"' "$RESOLVED" || { echo "!! SwiftTerm 版本漂移（拍板项 1 锁 1.13.0）"; exit 1; }
          grep -q "SwiftTerm" build.log || echo "WARN: build.log 无 SwiftTerm 编译引用（检查 target dependencies 接线）"
          echo "N10 SwiftTerm SPM 门通过（identity 在场 + 版本 1.13.0 锁定）"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/WanWo.app" Payload/
          # N2 手动 embed（run 38992198215 实证：Products 有两 framework、
          # XcodeGen embed: true 未生成任何 Embed phase——手动补进 ipa；
          # 免签包不签 framework，用户签名安装时整包重签）
          mkdir -p "Payload/WanWo.app/Frameworks"
          cp -R "build/Build/Products/Release-iphoneos/CoreCompiler.framework" "Payload/WanWo.app/Frameworks/"
          cp -R "build/Build/Products/Release-iphoneos/MobileDevelopmentKit.framework" "Payload/WanWo.app/Frameworks/"
          # N7a：OpenSSL.framework embed（ZSign 运行时动态依赖；XcodeGen embed 坑
          # 同款——手动 cp 兜底；三方对照 0.10.3 官方同形态 CodeSignOnCopy）
          cp -R "build/Build/Products/Release-iphoneos/OpenSSL.framework" "Payload/WanWo.app/Frameworks/" 2>/dev/null || echo "OpenSSL.framework 未在 Products（见下方计数门）"
          # 修⑪（真机 crash 实证 WanWo-2026-10-17-105200.ips：dyld "Library
          # missing @rpath/lib_CompilerSwiftBasicFormat.dylib"，引用者=CC 本体）：
          # CC 以动态链接消费 14 个 SupportLibs dylib（本地 Mach-O 解析实证
          # CC 依赖闭包=14 dylib 互引+系统库，minos 全部 16.0 与 16.6.1 兼容）
          # ——设备运行时必须与 CC 同层可见，一并 embed。
          cp Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwift*.dylib "Payload/WanWo.app/Frameworks/"
          echo "=== Frameworks 落位验证 ==="
          ls -lh "Payload/WanWo.app/Frameworks/"
          DYLIB_N=$(ls "Payload/WanWo.app/Frameworks/" | grep -c '^lib_CompilerSwift.*\.dylib$')
          FW_N=$(ls "Payload/WanWo.app/Frameworks/" | grep -c '\.framework$')
          echo "dylib 数: ${DYLIB_N} (expect 14) / framework 数: ${FW_N} (expect 2)"
          test "${DYLIB_N}" -eq 14 || { echo "!! dylib embed 失败"; exit 1; }
          # N7a：OpenSSL.framework 计数门（3=CC+MDK+OpenSSL）——ZSign 动态依赖
          # 运行时必须同层可见；若 Products 未产出（XcodeGen framework 引用形态
          # 差异），显式失败暴露而非静默缺库
          echo "frameworks: $(ls "Payload/WanWo.app/Frameworks/" | grep '\.framework$' | tr '\n' ' ')"
          test "${FW_N}" -ge 2 || { echo "!! framework embed 失败"; exit 1; }
          if ! ls "Payload/WanWo.app/Frameworks/" | grep -q '^OpenSSL\.framework$'; then
            # Products 无 OpenSSL.framework 时从 xcframework 切片直取（二进制同源）
            mkdir -p "Payload/WanWo.app/Frameworks/OpenSSL.framework"
            cp -R "Vendor/nyxian/LindChain/OpenSSL.xcframework/ios-arm64/OpenSSL.framework/" "Payload/WanWo.app/Frameworks/OpenSSL.framework/"
            echo "OpenSSL.framework 从 xcframework 切片直取落位"
          fi
          test -f "Payload/WanWo.app/Frameworks/OpenSSL.framework/OpenSSL" || { echo "!! OpenSSL embed 失败"; exit 1; }
          # N8：WanWoLiveProcess.appex 手动 embed（XcodeGen embed 坑同款——主
          # target dependencies 已挂构建顺序，Products 直取 cp 进 PlugIns/）
          mkdir -p "Payload/WanWo.app/PlugIns"
          cp -R "build/Build/Products/Release-iphoneos/WanWoLiveProcess.appex" "Payload/WanWo.app/PlugIns/"
          # N8：Shared/LaunchServices 两 plist 落位（PELaunchServiceRegistry 读
          # mainBundle/Shared/LaunchServices/——目录结构必须保真；XcodeGen folder
          # 展开坑 → Package 步骤 cp + 计数门，RootfsPatch/Templates 同款纪律）
          mkdir -p "Payload/WanWo.app/Shared/LaunchServices"
          cp Vendor/nyxian/Shared/LaunchServices/containerd.plist "Payload/WanWo.app/Shared/LaunchServices/"
          cp Vendor/nyxian/Shared/LaunchServices/installd.plist "Payload/WanWo.app/Shared/LaunchServices/"
          # N8 计数门：appex 目录 + 两 plist（宿主运行时 ignition 的输入）
          test -d "Payload/WanWo.app/PlugIns/WanWoLiveProcess.appex" || { echo "!! WanWoLiveProcess.appex embed 失败"; exit 1; }
          # N8 装机复测修：appex 版本键硬门——CI ValidateEmbeddedBinary 不覆盖
          # 这两键（CI 绿真机装不上的教训），installd "bundleVersion must be
          # set in placeholder attributes" 拒装根因键必须显式立门。plutil 为
          # macOS runner 自带。门值与 project.yml appex settings.base 两键同源。
          # N8 装机复测修·第二轮：门扩展为「appex 必需键族」断言——设备
          # installd 拒装实证 MissingBundleDisplayNameString（CFBundleDisplayName
          # 非空缺失即拒）+ 官方 0.10.3 成品逐键对质（键集合差异恰两键全为
          # 官方有我们没有：CFBundleDisplayName/UIMainStoryboardFile）。教训：
          # installd 对 appex plist 校验逐关推进，必需键族以官方成品对质为准，
          # 一次建全：两版本键 + displayName + 空串 UIMainStoryboardFile +
          # CFBundleName/CFBundleExecutable/NSExtension 存在性。
          APPEX_PLIST="Payload/WanWo.app/PlugIns/WanWoLiveProcess.appex/Info.plist"
          APPEX_VER=$(plutil -extract CFBundleVersion raw "${APPEX_PLIST}") || { echo "!! appex CFBundleVersion 缺失（installd 拒装根因键）"; exit 1; }
          echo "appex CFBundleVersion = ${APPEX_VER} (expect 3)"
          test "${APPEX_VER}" = "3" || { echo "!! appex CFBundleVersion 值异常: ${APPEX_VER}"; exit 1; }
          APPEX_SHORT_VER=$(plutil -extract CFBundleShortVersionString raw "${APPEX_PLIST}") || { echo "!! appex CFBundleShortVersionString 缺失（同根因键族）"; exit 1; }
          echo "appex CFBundleShortVersionString = ${APPEX_SHORT_VER} (expect 0.0.1)"
          test "${APPEX_SHORT_VER}" = "0.0.1" || { echo "!! appex CFBundleShortVersionString 值异常: ${APPEX_SHORT_VER}"; exit 1; }
          APPEX_DISPLAY=$(plutil -extract CFBundleDisplayName raw "${APPEX_PLIST}") || { echo "!! appex CFBundleDisplayName 缺失（设备 installd MissingBundleDisplayNameString 拒装键）"; exit 1; }
          echo "appex CFBundleDisplayName = ${APPEX_DISPLAY} (expect WanWoLiveProcess)"
          test -n "${APPEX_DISPLAY}" || { echo "!! appex CFBundleDisplayName 空串（installd 要求非零长度）"; exit 1; }
          test "${APPEX_DISPLAY}" = "WanWoLiveProcess" || { echo "!! appex CFBundleDisplayName 值异常: ${APPEX_DISPLAY}"; exit 1; }
          # UIMainStoryboardFile：官方成品=空字符串（构建设置空值 Xcode 忽略，
          # 源 plist 静态落键）——存在性 + 空串双断言（plutil -extract 空串
          # 成功返回空输出，须显式区分"取到空串"与"键缺失"）
          APPEX_STORYBOARD=$(plutil -extract UIMainStoryboardFile raw "${APPEX_PLIST}") || { echo "!! appex UIMainStoryboardFile 缺失（官方成品有此键）"; exit 1; }
          echo "appex UIMainStoryboardFile = '${APPEX_STORYBOARD}' (expect 空串)"
          test -z "${APPEX_STORYBOARD}" || { echo "!! appex UIMainStoryboardFile 应为空串，实值: '${APPEX_STORYBOARD}'"; exit 1; }
          APPEX_NAME=$(plutil -extract CFBundleName raw "${APPEX_PLIST}") || { echo "!! appex CFBundleName 缺失"; exit 1; }
          echo "appex CFBundleName = ${APPEX_NAME}"
          test -n "${APPEX_NAME}" || { echo "!! appex CFBundleName 空串"; exit 1; }
          APPEX_EXEC=$(plutil -extract CFBundleExecutable raw "${APPEX_PLIST}") || { echo "!! appex CFBundleExecutable 缺失"; exit 1; }
          echo "appex CFBundleExecutable = ${APPEX_EXEC}"
          test -n "${APPEX_EXEC}" || { echo "!! appex CFBundleExecutable 空串"; exit 1; }
          # NSExtension：appex 身份键（字典类型——xml1 子树落 /dev/null 存在性断言）
          plutil -extract NSExtension xml1 -o /dev/null "${APPEX_PLIST}" || { echo "!! appex NSExtension 缺失（appex 身份键）"; exit 1; }
          echo "appex NSExtension 存在 ✓"
          echo "=== N8 appex 必需键族门全通过 ==="
          test -f "Payload/WanWo.app/Shared/LaunchServices/containerd.plist" || { echo "!! containerd.plist 缺失"; exit 1; }
          test -f "Payload/WanWo.app/Shared/LaunchServices/installd.plist" || { echo "!! installd.plist 缺失"; exit 1; }
          ls -lh "Payload/WanWo.app/PlugIns/" "Payload/WanWo.app/Shared/LaunchServices/"
          zip -qry "WanWo-${{ github.sha }}.ipa" Payload
          ls -lh WanWo-*.ipa
          unzip -l "WanWo-${{ github.sha }}.ipa" | grep -c "Frameworks/CoreCompiler" || { echo "!! embed 失败"; exit 1; }
          unzip -l "WanWo-${{ github.sha }}.ipa" | grep -c "Frameworks/lib_CompilerSwift" || { echo "!! dylib embed 失败"; exit 1; }
          # N8：ipa 内 appex 与 LaunchServices 计数门（unzip -l 验证）
          unzip -l "WanWo-${{ github.sha }}.ipa" | grep -q "PlugIns/WanWoLiveProcess.appex/" || { echo "!! ipa 内无 appex"; exit 1; }
          unzip -l "WanWo-${{ github.sha }}.ipa" | grep -q "Shared/LaunchServices/containerd.plist" || { echo "!! ipa 内无 containerd.plist"; exit 1; }
          unzip -l "WanWo-${{ github.sha }}.ipa" | grep -q "Shared/LaunchServices/installd.plist" || { echo "!! ipa 内无 installd.plist"; exit 1; }
          echo "N8 计数门全通过（PlugIns/WanWoLiveProcess.appex + Shared/LaunchServices×2）"

      - name: Link diagnostics (on failure)
        if: failure()
        run: |
          echo "=== 主 App Ld 命令行（全量）==="
          grep -m1 "Ld /.*WanWo normal" build.log || echo "(未见 Ld 行)"
          echo "=== -framework 旗标统计 ==="
          grep -o "\-framework [A-Za-z]*" build.log | sort | uniq -c | head -12
          echo "=== CC/MDK framework 产物 ==="
          ls build/Build/Products/Release-iphoneos/ 2>/dev/null
          ls build/Build/Products/Release-iphoneos/CoreCompiler.framework/ 2>/dev/null | head -6
          echo "=== pbxproj 接线证据 ==="
          grep -c "CoreCompiler.framework" WanWo.xcodeproj/project.pbxproj || true
          grep -n "FRAMEWORK_SEARCH_PATHS" WanWo.xcodeproj/project.pbxproj | head -3 || true
          echo "=== 主 App 符号探针（CC 符号在 CC.framework 里吗）==="
          nm build/Build/Products/Release-iphoneos/CoreCompiler.framework/CoreCompiler 2>/dev/null | grep -c "_CCGetMaximumPerformanceCores" || echo "0（CC 二进制无此符号！）"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WanWo-ipa
          path: WanWo-*.ipa
          retention-days: 30

  # 【历史留痕已归档 2026-09-30】2026-09-11~09-14 七次一次性验证跑（M4~M5 各批
  # one-shot 测试轨）的终局记录原文迁至工作区 analysis/ios-yml-history.md。
  # 口径不变：不建常驻测试轨道（2026-09-11 用户裁决）；WanWoTests 代码保留；
  # 一次性验证走 workflow_dispatch-only 的 test.yml（2026-09-28 M7 批1 件 F 重建）。
