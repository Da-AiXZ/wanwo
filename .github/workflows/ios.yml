name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          # llvm + lld：vdso 交叉构建需要（clang -target aarch64-linux-gnu -fuse-ld=lld）
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iPad)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/WanWo.app" Payload/
          zip -qry "WanWo-${{ github.sha }}.ipa" Payload
          ls -lh WanWo-*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WanWo-ipa
          path: WanWo-*.ipa
          retention-days: 30

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          # iSH 库的平台变体：arm64 真机库与 arm64 模拟器是不同 Mach-O 平台，
          # 链接器拒绝混链——真机 ipa 已打包上传，此处重编 sim 平台库覆盖工作
          # 区副本供模拟器测试链接（真机产物路径与脚本默认行为零影响）。
          ./scripts/build_ish.sh release ios-sim "$PWD/build/simlibs"
          cp build/simlibs/*.a Vendor/libs/
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee test.log

      - name: Upload test log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 14
