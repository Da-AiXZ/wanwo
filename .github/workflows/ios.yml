name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          # llvm + lld：vdso 交叉构建需要（clang -target aarch64-linux-gnu -fuse-ld=lld）
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iPad)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/WanWo.app" Payload/
          zip -qry "WanWo-${{ github.sha }}.ipa" Payload
          ls -lh WanWo-*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WanWo-ipa
          path: WanWo-*.ipa
          retention-days: 30

  # 【历史留痕已归档 2026-09-30】2026-09-11~09-14 七次一次性验证跑（M4~M5 各批
  # one-shot 测试轨）的终局记录原文迁至工作区 analysis/ios-yml-history.md。
  # 口径不变：不建常驻测试轨道（2026-09-11 用户裁决）；WanWoTests 代码保留；
  # 一次性验证走 workflow_dispatch-only 的 test.yml（2026-09-28 M7 批1 件 F 重建）。
