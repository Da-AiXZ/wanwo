# iOS Unit Tests (one-shot) —— 【用户裁决 B：一次性验证跑，沿 M4-A/M4-B 先例】
# 触发：仅 workflow_dispatch（手动），绝不随 push 自动跑。
# 用途：M4-C（C1-C7 全七件）新增用例（ToolSearchEngine 12 / ToolSearchTool 13+4 /
# ToolSearchAssembly 13 / ToolSearchActivation 14 / SourceListing 8 / Budget 6 = 67）
# 随存量 222 = ~289 用例的首次 CI 编译+运行验证。
# 处置：跑完即拆（不建常驻轨道；ios.yml 终局留痕沿 M4-A/M4-B 收尾先例）。
# 步骤源：M4-B 先例 test.yml（git 历史 d3c4fb7）1:1——含 ios-sim 库变体
# 重编与 rootfs 占位生成（ERR-008 教训：App target 资源声明需要它）。
name: iOS Unit Tests (one-shot)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          # llvm + lld：vdso 交叉构建需要（clang -target aarch64-linux-gnu -fuse-ld=lld）
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          # iSH 库的平台变体：arm64 真机库与 arm64 模拟器是不同 Mach-O 平台，
          # 链接器拒绝混链——重编 sim 平台库覆盖工作区副本供模拟器测试链接
          # （真机产物路径与脚本默认行为零影响）。
          ./scripts/build_ish.sh release ios-sim "$PWD/build/simlibs"
          cp build/simlibs/*.a Vendor/libs/
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee test.log

      - name: Upload test log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 14
