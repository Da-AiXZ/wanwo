# iOS Unit Tests (one-shot) —— 【用户裁决 B：一次性验证跑，沿 M4-A/M4-B/M4-C 先例】
# 触发：仅 workflow_dispatch（手动），绝不随 push 自动跑。
# 用途：M4-D（D1-D7 全七件）新增用例（SkillParser 9 / SkillRegistry 12 /
# BundledSkillInstaller 5 / SkillCatalogInjector 11+1 / SkillTool ~12 /
# SkillMentionInjector 16 / SkillSettingsStore 10 ≈ 76）随存量回归的首次
# CI 编译+运行验证。
# 处置：跑完即拆（不建常驻轨道；ios.yml 终局留痕沿先例）。
# 步骤源：M4-C 先例 test.yml（git 历史 6f1eeea）1:1——含 ios-sim 库变体
# 重编与 rootfs 占位生成（ERR-008 教训：App target 资源声明需要它）。
name: iOS Unit Tests (one-shot)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          ./scripts/build_ish.sh release ios-sim "$PWD/build/simlibs"
          cp build/simlibs/*.a Vendor/libs/
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee test.log

      - name: Upload test log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 14
