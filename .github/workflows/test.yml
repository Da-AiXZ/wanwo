# iOS Unit Tests (one-shot) —— 【用户裁决 B：一次性验证跑】
# 触发：仅 workflow_dispatch（手动），绝不随 push 自动跑。
# 用途：UI 修复批 2（工作区模型四件：项目=iSH 内建目录/文件域共享/cwd 接
# 执行面/skills 项目级+未分组删除；挂载确认卡 overlay 根治；hero 空态+dock
# composer；设置页实体按钮+配色统一）。新增 WorkspaceAdoptionTests + 更新
# 分组/路径/skills/注册表五件随存量全量首次 CI 编译+运行验证。
# 处置：跑完即拆（不建常驻轨道；ios.yml 终局留痕沿 M4-C/D 先例）。
# 步骤源：M4-A 先例 test.yml（git 历史 957aa41）1:1——含 ios-sim 库变体
# 重编与 rootfs 占位生成（ERR-008 教训：App target 资源声明需要它）。
name: iOS Unit Tests (one-shot)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install toolchain
        run: |
          brew install xcodegen
          brew install meson ninja
          # llvm + lld：vdso 交叉构建需要（clang -target aarch64-linux-gnu -fuse-ld=lld）
          brew install --quiet llvm || echo "WARN: llvm install failed"
          brew install --quiet lld || echo "WARN: lld install failed, vdso will be skipped"

      - name: Build iSH static libraries
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_ish.sh release

      - name: Prepare Alpine rootfs
        run: ./scripts/fetch_rootfs.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          # iSH 库的平台变体：arm64 真机库与 arm64 模拟器是不同 Mach-O 平台，
          # 链接器拒绝混链——重编 sim 平台库覆盖工作区副本供模拟器测试链接
          # （真机产物路径与脚本默认行为零影响）。
          ./scripts/build_ish.sh release ios-sim "$PWD/build/simlibs"
          cp build/simlibs/*.a Vendor/libs/
          # 终验补三（2026-09-16）：WebKit Swift overlay（libswiftWebKit.dylib）
          # 在 18.4+ sim runtime 被移除（18.5 dyld 早崩 35041393412 实证）——
          # runner 实测 runtimes=18.5/18.6/26.0/26.1/26.2（无旧可逃）→ 改选
          # 最新 runtime（26.x 或已恢复 overlay/或其 dyld cache 含之）。
          # awk 匹配修正："/iPhone/"（设备名带空格，原 /iPhone \( / 永不命中
          # = UDID 空实证 35043626399）。
          echo "=== available runtimes ==="
          xcrun simctl list runtimes
          SIM_UDID=$(xcrun simctl list devices available | awk '
            /^-- iOS/ { ver = $3 + 0 }   # 节头="-- iOS 26.2 --"：版本在 $3（$2 是"iOS"）
            /iPhone/ && ver > 0 { print ver, $0 }
          ' | sort -nr | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "Using simulator UDID: $SIM_UDID (newest runtime preferred)"
          test -n "$SIM_UDID"
          # 终验（项目侧弱链接方案，见 project.yml OTHER_LDFLAGS）：WebKit
          # Swift overlay 在新 sim runtime/新工具链已被移除——弱链接=缺失容忍，
          # 单阶段 xcodebuild test 即可（两阶段复制方案作废：runner 全盘
          # find 无此 dylib，35042226955 实证）。真机 16.6 自带不受影响。
          xcodebuild \
            -project WanWo.xcodeproj \
            -scheme WanWo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee test.log

      - name: Upload test log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 14
