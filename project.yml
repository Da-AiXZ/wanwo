      - path: Vendor/nyxian/LindChain/ProcEnvironment/Syscall/mach_syscall_server.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Syscall/payload.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Utils/fd.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Utils/klog.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Utils/ktfp.c
      - path: Vendor/nyxian/LindChain/litehook/litehook.c
      - path: Vendor/nyxian/LindChain/Private/UIKitPrivate.m
      - path: Vendor/nyxian/LindChain/Private/mach/fileport.m
      - path: Vendor/nyxian/LindChain/WindowServer/NXAppTile.m
      - path: Vendor/nyxian/LindChain/WindowServer/NXWindowServer.m
      - path: Vendor/nyxian/LindChain/WindowServer/Session/NXWindowSessionApplication.m
      - path: Vendor/nyxian/LindChain/WindowServer/Session/NXWindowSessionTerminal.m
      - path: Vendor/nyxian/LindChain/WindowServer/Window/NXResizeHandle.m
