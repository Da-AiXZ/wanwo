name: WanWo

options:
  bundleIdPrefix: com.wanwo
  deploymentTarget:
    iOS: "16.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

# M1 远程 SPM 依赖（10-design §十二已批准；§2.7"无本地 SPM 模块包"不受影响——
# 远程包声明于本 packages: 节，非本地包）：
#   - GRDB.swift ^7.0（MIT）：SQLite 投影索引
#   - swift-collections ^1.1（Apache-2.0）：Deque（流缓冲）
# M4-A 追加（用户拍板底座，红线 R2 版本锁定）：
#   - mcp-swift-sdk exact 0.12.1（MIT）：MCP 官方 Swift SDK（product MCP，
#     规范 2025-11-25）——WanWo = Swift 官方 SDK 底座 + 自建语义层（dsh 同构）
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.12.1"
  # 批12 T7：流式 Markdown 渲染（microsoft/SwiftStreamingMarkdown，MIT；
  # iOS 16+ ✓；助手正文 MarkdownView + 流式正文 StreamedMarkdownView）。
  # revision pin（=v0.7.0 tag commit 5f7c04e）：其子依赖 HighlightSwift 为
  # revision pin（无 tag），SPM 禁止根项目对这种包用 stable-version 依赖
  #（CI run 35821566038 实证"stable-version vs unstable-version"解析失败）。
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: 5f7c04e0558df6146f90d482edb62cb456986bda

targets:
  WanWo:
    type: application
    platform: iOS
    sources:
      - path: WanWo
      # 宿主桥（ObjC，链接 iSH 静态库）
      - path: Platform
      # Alpine rootfs（fakefs：data/ + meta.db 的 zip 包），单文件资源
      # （10-design v2.2：RootfsInstaller 从 bundle 解压 alpine-rootfs.zip 安装）
      - path: WanWo/Resources/alpine-rootfs.zip
        buildPhase: resources
      # Bashism 规则（M2.4：BashismDetector 运行时加载；OpenMinis src/shared 共享 JSON）
      - path: WanWo/Resources/bashism_rules.json
        buildPhase: resources
      # M4-D D2：bundled 预装技能——CI 首跑实证 `type: folder` 被展开为独立
      #资源（两份 SKILL.md 同名冲突 Multiple commands）→ 改 codex include_dir!
      #同款思路：内容内嵌 BundledSkillInstaller.bundledTemplates（Swift 常量），
      #安装面写容器 skills/.bundled/，发现面 bundled rank 单独成根。零资源文件。
      # RootfsPatch.bundle（ERR-019：boot 时 FsApplyOverlay 从 mainBundle 加载，
      # 对齐 OpenMinis pbxproj:33 Resources phase 集成方式）
      - path: Vendor/resources/RootfsPatch.bundle
        buildPhase: resources
      # M5-B P2：PTC TS 转译资源（@mizchi/sucrase 4.1.0 dist/index.cjs 的
      # JSContext 包装单文件；拍板项① Sucrase 内嵌 JSCore）——单文件资源零冲突
      # （D2 先例：folder reference 展开冲突，单文件路径直接落 Resources phase）
      - path: WanWo/Resources/Ptc/sucrase.js
        buildPhase: resources
      # ── N3b（13 号设计）：编译引导闭包接入主 App——NXBootstrap（vendored
      # 16 化版）+ 其 ObjC 依赖；Swift 侧经 WanWo-Bridging-Header.h 访问
      # （NXBootstrap/MDKOSVersion；bridging 含 C++ 头的 framework 不可直接
      # import——N2 修②同款纪律）。
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXBootstrap.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXAlertDiagnosticPresenter.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXRemoteCompiler.m
      - path: Vendor/nyxian/LindChain/Utils/Zip.m
      # ── N4/N5（13 号设计环定义）：IDEFoundation 项目模型 + IDEBuilder
      # 构建编排。逐文件列法（不整目录——排除件：IconUtils.m 零消费者+
      # ISIcon/bootstrapd 私有依赖、CFTools.c/LDEDebouncer.m 零消费者、
      # NXConsoleView/IDELanguageServer 属 N6+ 环）。适配 diff 全登记
      # docs/gpl-compliance.md §N4N5（NXRemoteCompiler.m=万我空壳实现、
      # NXProject.m→WanWo-Swift.h、NXBuilder.swift 三段 WANWO_BUILD_RUN/UI
      # 守卫、NXProject.h entitlement 空引用删、NXOSVersion.swift 自 UI 层
      # 字节级提取、NXPhaseRunner.m XCodeButton→Compat）。
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXProject.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXPlist.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXType.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXDocument.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXDocumentManager.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXCodeTemplate.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXUser.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/NXUtils.m
      - path: Vendor/nyxian/LindChain/IDEFoundation/Project+Debug.swift
      - path: Vendor/nyxian/LindChain/IDEBuilder/NXBuilder.swift
      - path: Vendor/nyxian/LindChain/IDEBuilder/NXBuilder+MDKDriver.swift
      - path: Vendor/nyxian/LindChain/IDEBuilder/NXBuilder+MDKPhaseRunner.swift
      - path: Vendor/nyxian/LindChain/IDEBuilder/NXPhaseEngine.m
      - path: Vendor/nyxian/LindChain/IDEBuilder/NXPhaseRunner.m
      - path: Vendor/nyxian/LindChain/IDEBuilder/LDEFilesFinder.m
      # ── N7a 签名链落位（analysis/n7-signing-chain-plan.md）：LiveContainer
      # 的 ZSign 纯净编译子集（15 文件，仅依赖 openssl+标准库）。LC 层 .m
      #（LCBootstrap/LCUtils/LCMachOUtils/utils）依赖闭包大（Private/litehook/
      # ProcEnvironment/applicationmgmtd）——落目录不编译，N8/N9 按需扩大；
      # Tweaks 9 文件同（guest appex 专属，N9）。签名入口走 ZSigner（zsigner.m
      # →zsign.hpp extern "C" ✓）。
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/zsigner.m
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/zsign.mm
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/Utils.mm
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/archo.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/bundle.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/macho.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/openssl.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/signing.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/base64.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/fs.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/json.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/log.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/sha.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/timer.cpp
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/common/util.cpp
      # N8：Swizzle 面换版 0.10.3（宿主原先编的 main 版 Swizzle.c 全仓 grep 零消费者
      # 实证，退役出编译面——文件保留在树（CFTools.c 先例）但不再编；appex 侧编
      # 0.10.3 Swizzle.m（Tweaks 消费 swizzle_objc_method 0.10.3 API）。登记 §N8。
      # - path: Vendor/nyxian/LindChain/Utils/Swizzle.c  ← N8 退役（见上注）
      - path: Vendor/nyxian/LindChain/Utils/entitlement.c
      - path: Vendor/nyxian/LindChain/Utils/NXOSVersion.swift
      # N3b：SDK + Shared 三 zip 内嵌资源（拍板 ③ 零网络；单文件形态——
      # D2 先例 folder 展开冲突，四 zip 文件名全唯一；NXBootstrap 侧路径
      # 已同步平铺适配，diff 登记 docs/gpl-compliance.md §N3b）
      - path: Vendor/nyxian/Shared/include.zip
        buildPhase: resources
      - path: Vendor/nyxian/Shared/lib.zip
        buildPhase: resources
      - path: Vendor/nyxian/Shared/swift.zip
        buildPhase: resources
      - path: Vendor/nyxian/Shared/SDK.zip
        buildPhase: resources
      # N5：官方模板资源（NXCodeTemplateMakeProjectStructure 消费——
      # createProject 内依赖，真机 createProject nil 定案；.bundle 整体
      # 拷贝保留目录结构——RootfsPatch.bundle 先例，Main.c×2 异目录共存）
      - path: Vendor/nyxian/Shared/Templates.bundle
        buildPhase: resources
      # ── N8（analysis/n8-runtime-foundation-plan.md）：运行侧底座宿主面——
      # 官方 0.10.3 emexDE 编译面镜像（pbxproj 例外集 798BBD33：Nyxian 树编入
      # −19 件；79BF9840：LiveProcess 组追加 3 件）。逐文件列法（万我纪律），
      # headers 一律不进 sources。ProcEnvironment 编入=全部 .m/.c 除官方排除的
      # 10 个根部 guest 件（application/cred/ioctl/libproc/posix_spawn/proxy/
      # syscall/sysctl/tfp/vfork——appex 专属，在 WanWoLiveProcess target 编）。
      # 附编 LiveContainer/{LCUtils,LCMachOUtils}.m（官方 emexDE 未排除=在编；
      # Object/MachOObject.m 的 _OBJC_CLASS_$_LCUtils/_checkCodeSignature 链接
      # 闭包必需）与 LindChain/Project/Project+NotificationServer.swift（官方
      # 0.10.3 LindChain 层文件，PEProcessManager.m:144 消费，字节级提取——
      # NXOSVersion.swift 先例）。diff 全登记 docs/gpl-compliance.md §N8。
      - path: Vendor/nyxian/LindChain/ProcEnvironment/environment.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/attrstrnilfix.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/panic.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/ArchiveObject.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/FDObject.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/FDMapObject.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/MachOObject.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/PEMachPort.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Object/PEObject.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PEBootstrapRegistry.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PEExtension.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PELaunchService.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PELaunchServiceRegistry.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PEProcess.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Process/PEProcessManager.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Server/Server.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Server/ServerSession.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/entitlement.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/extra/relax.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/key.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/obj/alloc.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/obj/event.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/obj/reference.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/permit.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/counter.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/fork.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/insert.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/list.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/lookup.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/proc.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/proc/remove.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/radix/radix.c
