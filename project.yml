      - path: Vendor/nyxian/LindChain/WindowServer/Window/NXWindowSession.m
      # LiveProcess 组追加给 emexDE 的 3 件（daemon 的宿主代理面，pbxproj 79BF9840）
      - path: WanWoLiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationObject.m
      - path: WanWoLiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationWorkspace.m
      - path: WanWoLiveProcess/LindChain/Services/containerd/PEContainer.m
      # MachOObject.m 链接闭包（官方 emexDE 同编——LC 两件不在其排除清单）
      - path: Vendor/nyxian/LindChain/LiveContainer/LCUtils.m
      - path: Vendor/nyxian/LindChain/LiveContainer/LCMachOUtils.m
      # PEProcessManager.m 消费的 NotificationServer（官方 0.10.3 LindChain 层
      # 文件字节级提取；NXOSVersion.swift 先例）
      - path: Vendor/nyxian/LindChain/Project/Project+NotificationServer.swift
    # ── N2（13 号设计）：编译链接线接入主 App——CC/MDK framework 自动
    # embed 进 ipa（Frameworks/ 目录，运行时 dlopen）。构建顺序由
    # target 依赖驱动：CC/MDK 先行（cc-mdk-smoke 同款工具链消费）。
    dependencies:
      # embed: true 显式声明（绿包 38953302190 实证 Frameworks/ 无两 framework——
      # XcodeGen 默认未 embed，装上会 dyld 启动崩）
      - target: CoreCompiler
        embed: true
      - target: MobileDevelopmentKit
        embed: true
      # N8：WanWoLiveProcess appex 构建顺序依赖（不 embed——XcodeGen embed 坑
      # 已知，ios.yml Package 步骤手动 cp 进 PlugIns/；N7a OpenSSL 同款先例）。
      # 注：本文件存在两个 target 级 dependencies 块（YAML 重复 key），此依赖
      # 两处同写（见下方第二块）——无论 Yams 取何语义均生效。
      - target: WanWoLiveProcess
      # N7a：OpenSSL 链接走 OTHER_LDFLAGS -framework OpenSSL + FRAMEWORK_SEARCH_PATHS
      # 指切片（XcodeGen xcframework deps 条目不生成 -framework 旗标——run 39156465610
      # Ld 统计实证只有 CC/MDK；embed 由 ios.yml 手动 cp+xcframework 直取兜底）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanwo.juyang
        # 显式框架搜索路径（同工程 framework target 产物解析——run 38938464832
        # "no such module 'CoreCompiler'" 实证默认解析不可靠）
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)"
          # N7a：OpenSSL.xcframework ios-arm64 切片（ld framework 搜索命中
          # OpenSSL.framework 二进制；xcframework 整体 ld 不直接吃）
          - "$(PROJECT_DIR)/Vendor/nyxian/LindChain/OpenSSL.xcframework/ios-arm64"
          # N8：Private 私有框架 tbd 四件（BackBoardServices/FrontBoard/
          # FrontBoardServices/RunningBoardServices）——官方 emexDE 同款
          #（pbxproj :1794-1798 FRAMEWORK_SEARCH_PATHS 含 Private/Frameworks；
          # FB*/RBS* 私有类符号经此根解析）
          - "$(PROJECT_DIR)/Vendor/nyxian/LindChain/Private/Frameworks"
        # 用户手绘应用图标（2026-09-22 提供）：单尺寸 1024 asset catalog 通用图标
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: WanWo/Bridge/WanWo-Bridging-Header.h
        # 三根：Vendor/include/ish（生成头）+ Vendor/ish（源码内部互 include）+ Vendor/include（ish/ 前缀伞）
        # 万我 M6.1 增第 4 根：WanWo/NativeOffload（offload 头；Platform/ISHKernel.m
        # 需跨目录 import WanWoOffloadGate.h / DeviceOffload.h 等，编译必需）
        # N3b 增第 5 根：Vendor/nyxian（<LindChain/...> 官方路径语义 + MDK 头）；
        # 第 6 根：WanWo/Features/BuildExt（NXBootstrap.m 引号 import XCButtonCompat.h）。
        # ⚠️ YAML 同 key 后者覆盖前者（run 39002278710 实证：N3b 数组形式被
        # 本条覆盖致桥接头 NXBootstrap.h not found）——本条为唯一 HEADER_SEARCH_PATHS。
        # N7a 增第 7 根：OpenSSLHeaders（openssl/ 子目录重排——xcframework Headers 平铺
        # 无法解析 <openssl/xxx.h>，ZSign 全部尖括号 openssl 引用经此根命中；头源=
        # OpenSSL.xcframework/ios-arm64 切片 140 头，diff 登记 gpl-compliance §N7）。
        # N8 增第 8 根：WanWoLiveProcess（宿主代理面头 <LindChain/Services/...>——
        # Vendor/nyxian 树内无 Services/，PEProcessManager.m/PEProcess.m/PEContainer.m
        # 的代理头经此根命中；官方 emexDE HEADER_SEARCH_PATHS 含 LiveProcess/ 同构）
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/include/ish $(SRCROOT)/Vendor/ish $(SRCROOT)/Vendor/include $(SRCROOT)/WanWo/NativeOffload $(PROJECT_DIR)/Vendor/nyxian $(SRCROOT)/WanWo/Features/BuildExt $(PROJECT_DIR)/Vendor/nyxian/LindChain/OpenSSLHeaders $(PROJECT_DIR)/Vendor/nyxian/LindChain/LiveContainer $(PROJECT_DIR)/Vendor/nyxian/LindChain/LiveContainer/ZSign/common $(PROJECT_DIR)/Vendor/nyxian/LindChain/LiveContainer/ZSign $(PROJECT_DIR)/WanWoLiveProcess"
        # N3b 修③（run 39003398834 实证）：桥接头 import MDKOSVersion 触发
        # MobileDevelopmentKit module 构建，MDKThreadPool.h:29 #import
        # <CoreCompiler/CCUtils.h> 在 -I Vendor/nyxian 加宽后命中 CC 源码树头
        # （非模块化）——-Wnon-modular-include-in-framework-module 被构建器
        # 升级 [-Werror] 拦截。该 include 是官方既定结构（官方 pbxproj 未设
        # 此键=警告不升级，绿跑实证）；显式关警告，语义对齐官方。
        CLANG_WARN_NON_MODULAR_INCLUDE_IN_FRAMEWORK_MODULE: NO
        # N3b 修④（run 39004087523 实证）：显式 module 预编译（Xcode 16
        # explicit modules）里该警告 clang 默认开启且参数带 [-Werror]——
        # CLANG_WARN_...=NO 只是"不加旗标"压不住默认开启的警告，须显式
        # -Wno-。同官方既定结构语义（CCUtils include 官方绿跑合法）。
        # N8：在同 key 值上追加 -DHOST_ENV（YAML 同 key 后者覆盖前者——万我实测坑，
        # 绝不另开同名 key；官方 emexDE OTHER_CFLAGS="-DHOST_ENV" 同语义）
        OTHER_CFLAGS: "$(inherited) -Wno-non-modular-include-in-framework-module -DHOST_ENV"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/libs"
        # 【回退登记】weak_library 方案（弱链接 WebKit Swift overlay）实测链接期
        # 即需文件存在（-weak_library 全路径缺失=ld 报 Build input file cannot
        # be found，35043089816）——回退；改走 CI 测试选旧 runtime 路线
        # （test.yml SIM_UDID 解析：旧 runtime 卷自带该库）。
        # 【N2 修⑥清理】修③曾加数组形式 OTHER_LDFLAGS（-framework CC/MDK），
        # 同 key 被本条覆盖=从未生效的死配置——本轮显式并入（见下）。
        # N3b 修⑤（run 39005032750 两族 undefined 实证）：
        # ① -framework CoreCompiler/MobileDevelopmentKit——N2 时 CC 符号靠
        #   Swift autolink（module 经 -F 解析→自动注入）；N3b -I Vendor/nyxian
        #   使 bridging 的 CC 头优先命中源码树（非模块化），autolink 推导失效
        #   →显式补齐（官方 pbxproj 主 App Frameworks 阶段同款显式条目）；
        # ② -larchive——N3b 新接的 Zip.m 用 libarchive；官方同款机制=SDK
        #   自带 libarchive.tbd（iOS 系统私有库，运行时走 dyld 共享缓存，
        #   不 embed；官方 pbxproj L275 SDKROOT/usr/lib/libarchive.tbd）。
        OTHER_LDFLAGS: "$(inherited) -lish -lish_emu -lfakefs -framework CoreCompiler -framework MobileDevelopmentKit -framework OpenSSL -larchive"
        CLANG_ENABLE_MODULES: YES
        # 万我 M6.1 增（B1b）：entitlements（HealthKit/HomeKit/NFC，按 OpenMinis
        # src/ios/Minis.entitlements 原样引入，见 WanWo.entitlements 注释）
        CODE_SIGN_ENTITLEMENTS: WanWo.entitlements
        # iSH 头文件按 GUEST_ARM64 条件编译（对齐 Vendor/ish/app/GuestARM64.xcconfig）
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GUEST_ARM64=1 ISH_INTERNAL=1"
        # iSH 头里的 C 声明以 ObjC(.m) 编译；QCExecutor.m 需 ObjC++? 实为 .m 即可（纯 C API）
    dependencies:
      # N8：appex 构建顺序依赖（与上方第一处 dependencies 块同写——YAML 重复
      # key 双保险；embed 由 ios.yml 手动 cp）
      - target: WanWoLiveProcess
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libresolv.tbd
      # M1 远程 SPM 依赖（§十二）
      - package: GRDB
      - package: swift-collections
        product: Collections
      # M4-A：MCP 官方 Swift SDK 底座（F029/F032；版本锁 0.12.1，红线 R2）
      - package: mcp-swift-sdk
        product: MCP
      # 批12 T7：流式 Markdown 渲染（助手正文 + 流式正文；exact 0.7.0）
      - package: SwiftStreamingMarkdown
    info:
      path: WanWo/Info.plist
      properties:
        CFBundleDisplayName: 万我
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # M4-E：hooks 配置放置面（拍板项①——Documents/hooks/ 双桥配置经
        # 文件 App 放入）。Apple 文档：iOS 11+ 需两个 key 同 YES，Documents
        # 才出现在文件 App（OpenMinis 同款 LSSupportsOpeningDocumentsInPlace）。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 外挂载排障（2026-09-18）：照 OpenMinis Info.plist:9-34 原样补文档
        # 类型声明（Minis→WanWo 品牌折算）——与 LSSupportsOpeningDocumentsInPlace
        # 同族的文档消费声明，对齐选择器安全作用域回话的声明面。
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
          - CFBundleTypeName: WanWo Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.wanwo.app.wanwobak]
        # 万我 M6.1 增（B1b）：隐私权限键随本批命令引入（10-design §8.3
        # 逐命令核对；文案按 OpenMinis src/ios/Info.plist 原样、Minis→WanWo）。
        # B1c 增：NSAlarmKitUsageDescription（apple-alarm 直连 vendored；
        # OpenMinis Info.plist :182-183 原样、Minis→WanWo）。
        # 未引入（非本批面）：NSCamera/NSMicrophone/NSFaceID（聊天输入面）、
        # NSLocationAlwaysAndWhenInUse（后台定位，简报 B1b 仅授权 WhenInUse）、
        # NSLocalNetwork/NSAppTransportSecurity（debug 面）。
        # 万我 M6.5 增（B3）：wanwo:// URL scheme 注册（形态照 OpenMinis
        # Info.plist:149-175 三件 CFBundleURLTypes）。
        # 本批实注册一件：资源链接 wanwo（B2 的 WanwoURLSchemeHandler + 本批
        # resolveWanwoURL 实体 + wanwo://settings/permissions 深链的消费方）。
        # OpenMinis 另两件——OAuth 回调（com.openminis.app）与 MCP 回调
        # （minis-mcp）——WanWo 现无对应消费方（Providers=API key 面无 OAuth 流；
        # MCP servers 配置无 OAuth 授权面），按派单口径先不注册、仅在此注释预留：
        #   OAuth 回调 → CFBundleURLSchemes: [com.wanwo.juyang]（待 Providers OAuth）
        #   MCP 回调   → CFBundleURLSchemes: [wanwo-mcp]（待 MCP OAuth 面）
        CFBundleURLTypes:
          - CFBundleURLName: WanWo Resource Link
            CFBundleURLSchemes:
              - wanwo
        NSAlarmKitUsageDescription: WanWo uses AlarmKit so the AI agent can set alarms and timers on your behalf.
        NSCalendarsFullAccessUsageDescription: WanWo uses calendar access so the AI agent can query your schedule, check availability, and create events on your behalf.
        NSCalendarsUsageDescription: WanWo uses calendar access so the AI agent can query your schedule, check availability, and create events on your behalf.
        NSLocationWhenInUseUsageDescription: WanWo uses your location to record where agent sessions are started for your session history.
        NSHealthShareUsageDescription: WanWo uses HealthKit access so the AI agent can read your health data such as steps, heart rate, sleep, and workouts on your behalf.
        NSHealthUpdateUsageDescription: WanWo uses HealthKit write access so the AI agent can log health data such as steps, weight, and water intake on your behalf.
        NSPhotoLibraryUsageDescription: WanWo needs photo library access to attach images to AI conversations.
        NSPhotoLibraryAddUsageDescription: WanWo needs permission to save videos and images to your photo library.
        NSAppleMusicUsageDescription: WanWo uses media library access so the AI agent can search your music library and control playback on your behalf.
        NSSpeechRecognitionUsageDescription: WanWo uses speech recognition to convert your voice into text messages.
        NSBluetoothAlwaysUsageDescription: WanWo uses Bluetooth so the AI agent can scan for, connect to, and communicate with nearby BLE devices on your behalf.
        NSBluetoothPeripheralUsageDescription: WanWo uses Bluetooth so the AI agent can scan for, connect to, and communicate with nearby BLE devices on your behalf.
        NFCReaderUsageDescription: WanWo uses NFC so the AI agent can read and write NFC tags on your behalf.
        NSHomeKitUsageDescription: WanWo uses HomeKit access so the AI agent can query and control your smart home accessories on your behalf.
        NSRemindersFullAccessUsageDescription: WanWo uses reminders access so the AI agent can query and create reminders on your behalf.
        NSRemindersUsageDescription: WanWo uses reminders access so the AI agent can query and create reminders on your behalf.

  # M3 T1：单元测试目标（纯逻辑单测，WanWoTests 已批；CI 无 test action——
  # 按收益取舍本地跑；不触碰 WanWo 主 target 的任何编译宏/链接参数基线）。
  WanWoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WanWoTests
    dependencies:
      - target: WanWo
      # M4-A 件12：单测直接 import MCP 类型（CreateElicitation/Value 等
      # SDK 面）——test target 需显式声明包依赖。
      - package: mcp-swift-sdk
        product: MCP
      # M4-E+ P1：单测直接 import GRDB 构造 v2 旧库 fixture（v2→v3 迁移
      # 测试需以相同 identifier 预记账 grdb_migrations）。
      - package: GRDB

  # ── N0（13 号设计 §五）：vendored 编译链两 framework ──
  # 源码 = Nyxian main@0587c302a08（官方 10-01 绿跑同 commit，字节级落位
  # + 品牌串机械替换，登记 docs/gpl-compliance.md）。
  # N0 空转绿纪律：两 target 不进任何 scheme、主 App 零依赖——主流水线
  # 构建路径零变化；真编译在 N1（CI 下载工具链 Release 后接通）。
  CoreCompiler:
    type: framework
    platform: iOS
    configFiles:
      Debug: Configs/CoreCompiler.xcconfig
      Release: Configs/CoreCompiler.xcconfig
    sources:
      - path: Vendor/nyxian/CoreCompiler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanwo.CoreCompiler
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        OTHER_CFLAGS: "-std=gnu17"
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "$(OTHER_CFLAGS)", "-std=gnu++17"]
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        # 对齐官方 main 版形态（0587c30 pbxproj：同步文件夹成员=全路径链接输入，
        # 无任何 -l 旗标——"llvm.a 无 lib 前缀，-lllvm 永远解析不到"是 probe 旧版
        # 形态的隐患，run 38933052078/38934655419 undefined 实证）。名单=工具链
        # artifact 实物 14 dylib+llvm.a。
        OTHER_LDFLAGS:
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/LLVM.xcframework/ios-arm64/llvm.a"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftBasicFormat.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftCompilerPluginMessageHandling.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftDiagnostics.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftIDEUtils.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftIfConfig.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftLexicalLookup.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftOperators.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftParser.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftParserDiagnostics.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftSyntax.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxBuilder.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxMacroExpansion.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftSyntaxMacros.dylib"
          - "$(PROJECT_DIR)/Vendor/nyxian/CoreCompilerSupportLibs/lib_CompilerSwiftWarningControl.dylib"
          # -lz：llvm.a 的 Compression.cpp.o/CRC.cpp.o 引用 zlib（compress/decompress/crc32/
          # uncompress——run 38935535884 undefined 实证；官方 10-01 链接行同款有 -lz）
          - "-lz"
          - "-lc++"
        WARNING_CFLAGS:
          - "-Wno-shorten-64-to-32"
          - "-Wno-documentation"
          - "-Wno-documentation-deprecated-sync"
          - "-Wno-comma"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  MobileDevelopmentKit:
    type: framework
    platform: iOS
    configFiles:
      Debug: Configs/MobileDevelopmentKit.xcconfig
      Release: Configs/MobileDevelopmentKit.xcconfig
    sources:
      - path: Vendor/nyxian/MobileDevelopmentKit
    dependencies:
      - target: CoreCompiler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanwo.MobileDevelopmentKit
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── N8：运行侧 appex（官方 0.10.3 LiveProcess target 1:1 镜像，品牌折算
  # WanWoLiveProcess / com.wanwo.juyang.LiveProcess）──
  # 编译面 = 官方 LiveProcess target 两个例外集逐件换算（pbxproj：79BF983D
  # 「LiveProcess 组追加 6 件」+ 79BF9A97「Nyxian 组追加 38 件」；同步组例外
  # 语义 = target 未引用组 → 例外即追加清单）。appex 自编面（LiveContainer
  # LC 层/Tweaks/ZSign Utils.mm、ProcEnvironment guest 子集、Utils 三件）——
  # 与主 App 各自独立编译同一源文件（官方同构）。settings 同构官方
  #（pbxproj 1287-1316：-DCLIENT_ENV / HSEARCH 两根 / LD_RUNPATH 三项 /
  # -Wl,-U 两私有类 + -larchive / SKIP_INSTALL / 16.0 / DEAD_CODE_STRIPPING=NO
  # / GCC_OPTIMIZATION_LEVEL=s）。不进 schemes；主 target dependencies 已挂
  # 构建顺序；embed 由 ios.yml 手动 cp（XcodeGen embed 坑）。
  WanWoLiveProcess:
    type: app-extension
    platform: iOS
    sources:
      # 官方 LiveProcess 组 6 件（79BF983D）
      - path: WanWoLiveProcess/main.m
      - path: WanWoLiveProcess/ResecureDecoder.m
      - path: WanWoLiveProcess/LindChain/ServiceKit/Service.m
      - path: WanWoLiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationObject.m
      - path: WanWoLiveProcess/LindChain/Services/applicationmgmtd/LDEApplicationWorkspaceInternal.m
      - path: WanWoLiveProcess/LindChain/Services/containerd/PEContainerService.m
      # 官方 Nyxian 组追加 38 件（79BF9A97，路径换算万我树）
      - path: Vendor/nyxian/LindChain/Debugger/Utils.c
      - path: Vendor/nyxian/LindChain/litehook/litehook.c
      - path: Vendor/nyxian/LindChain/LiveContainer/LCBootstrap.m
      - path: Vendor/nyxian/LindChain/LiveContainer/LCMachOUtils.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/Dead10ccFix.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/Dyld.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/NSFileManager+GuestHooks.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/NSUserDefaults.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/SecItem.m
      - path: Vendor/nyxian/LindChain/LiveContainer/Tweaks/UIKit+GuestHooksInit.m
      - path: Vendor/nyxian/LindChain/LiveContainer/utils.m
      - path: Vendor/nyxian/LindChain/LiveContainer/ZSign/Utils.mm
