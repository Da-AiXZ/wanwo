name: WanWo

options:
  bundleIdPrefix: com.wanwo
  deploymentTarget:
    iOS: "16.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

# M1 远程 SPM 依赖（10-design §十二已批准；§2.7"无本地 SPM 模块包"不受影响——
# 远程包声明于本 packages: 节，非本地包）：
#   - GRDB.swift ^7.0（MIT）：SQLite 投影索引
#   - swift-collections ^1.1（Apache-2.0）：Deque（流缓冲）
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.1.0"

targets:
  WanWo:
    type: application
    platform: iOS
    sources:
      - path: WanWo
      # 宿主桥（ObjC，链接 iSH 静态库）
      - path: Platform
      # Alpine rootfs（fakefs：data/ + meta.db 的 zip 包），单文件资源
      # （10-design v2.2：RootfsInstaller 从 bundle 解压 alpine-rootfs.zip 安装）
      - path: WanWo/Resources/alpine-rootfs.zip
        buildPhase: resources
      # Bashism 规则（M2.4：BashismDetector 运行时加载；OpenMinis src/shared 共享 JSON）
      - path: WanWo/Resources/bashism_rules.json
        buildPhase: resources
      # RootfsPatch.bundle（ERR-019：boot 时 FsApplyOverlay 从 mainBundle 加载，
      # 对齐 OpenMinis pbxproj:33 Resources phase 集成方式）
      - path: Vendor/resources/RootfsPatch.bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanwo.juyang
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: WanWo/Bridge/WanWo-Bridging-Header.h
        # 三根：Vendor/include/ish（生成头）+ Vendor/ish（源码内部互 include）+ Vendor/include（ish/ 前缀伞）
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/include/ish $(SRCROOT)/Vendor/ish $(SRCROOT)/Vendor/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/libs"
        OTHER_LDFLAGS: "-lish -lish_emu -lfakefs"
        CLANG_ENABLE_MODULES: YES
        # iSH 头文件按 GUEST_ARM64 条件编译（对齐 Vendor/ish/app/GuestARM64.xcconfig）
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GUEST_ARM64=1 ISH_INTERNAL=1"
        # iSH 头里的 C 声明以 ObjC(.m) 编译；QCExecutor.m 需 ObjC++? 实为 .m 即可（纯 C API）
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libresolv.tbd
      # M1 远程 SPM 依赖（§十二）
      - package: GRDB
      - package: swift-collections
        product: Collections
    info:
      path: WanWo/Info.plist
      properties:
        CFBundleDisplayName: 万我
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  # M3 T1：单元测试目标（纯逻辑单测，WanWoTests 已批；CI 无 test action——
  # 按收益取舍本地跑；不触碰 WanWo 主 target 的任何编译宏/链接参数基线）。
  WanWoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WanWoTests
    dependencies:
      - target: WanWo

# 测试 scheme（本地 xcodebuild test 用；主流水线构建路径不受影响）。
schemes:
  WanWo:
    build:
      targets:
        WanWo: all
        WanWoTests: [test]
    test:
      targets:
        - WanWoTests
