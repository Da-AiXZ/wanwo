      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/compat/pectl.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/compat/procpath.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/compat/setent.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/compat/waittask.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/getgid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/getpid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/getsid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/getuid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/setgid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/setsid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/cred/setuid.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/host/ioctl.c
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/host/sysctl.m
      - path: Vendor/nyxian/LindChain/ProcEnvironment/Surface/sys/proc/kill.m
